    flex-direction: column;
    align-items: center;
    justify-content: center;

    opacity: 1;

      text-align: center;
      padding: 2.5rem 1.5rem;

        font-family: 'Amiri', 'Scheherazade New', 'Noto Naskh Arabic', 'Traditional Arabic', serif;

        margin-bottom: 1.75rem;

        height: 4px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        margin: 0 auto;
        overflow: hidden;
        position: relative;
      ">
        <div class="bismillah-progress-fill" style="
          height: 100%;
          width: 35%;
          background: linear-gradient(90deg, #F2A71B, #10B981);
          border-radius: 10px;
          transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);

    setTimeout(function() {
      var appEl = document.getElementById('app');
      if (appEl && (!appEl.children || appEl.children.length === 0)) {
        if (typeof window.initApp === 'function') {
          window.initApp();
        } else if (typeof window.renderApp === 'function') {
          window.renderApp();
        }
      }
    }, 250);
