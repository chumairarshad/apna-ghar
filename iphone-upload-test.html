<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone Upload Isolated Diagnostics — Sarmayadar</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1rem;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
    }
    h2 { color: #38bdf8; margin-top: 0; font-size: 1.25rem; }
    .card {
      background: #1e293b;
      padding: 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      border: 1px solid #334155;
    }
    label { display: block; font-weight: bold; margin-bottom: 0.5rem; color: #94a3b8; font-size: 0.85rem; }
    input[type="file"] {
      display: block;
      width: 100%;
      padding: 0.75rem;
      background: #0f172a;
      border: 2px dashed #38bdf8;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 0.9rem;
    }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    button {
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      color: white;
      background: #2563eb;
    }
    button:active { opacity: 0.8; }
    button.btn-test1 { background: #0284c7; }
    button.btn-test2 { background: #16a34a; }
    button.btn-test3 { background: #d97706; }
    button.btn-test4 { background: #9333ea; }
    pre {
      background: #090d16;
      color: #4ade80;
      padding: 1rem;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-all;
      font-family: monospace;
      font-size: 0.78rem;
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #1e293b;
    }
  </style>
</head>
<body>

  <h2>📱 iPhone Safari Independent Upload Test</h2>

  <div class="card">
    <label for="testFile">1. SELECT PHOTO FROM IPHONE</label>
    <input id="testFile" type="file" accept="image/*" />

    <div class="btn-group">
      <button class="btn-test1" id="btnTest1">Run Test 1 — File Metadata</button>
      <button class="btn-test2" id="btnTest2">Run Test 2 — Base64 JSON Upload</button>
      <button class="btn-test3" id="btnTest3">Run Test 3 — Multipart FormData Upload</button>
      <button class="btn-test4" id="btnTest4">Run Test 4 — Canvas Image Processing</button>
    </div>
  </div>

  <div class="card">
    <label>ISOLATED TEST LOG OUTPUT</label>
    <pre id="result">Waiting for file selection and test trigger...</pre>
  </div>

  <script>
    const fileInput = document.getElementById("testFile");
    const resultPre = document.getElementById("result");

    function log(msg) {
      resultPre.textContent = msg;
    }

    function appendLog(msg) {
      resultPre.textContent += "\n\n" + msg;
    }

    // TEST 1 — FILE SELECTION ONLY
    fileInput.addEventListener("change", () => {
      const file = fileInput.files?.[0];
      log("=== TEST 1: FILE SELECTION ===\n" + JSON.stringify({
        selected: !!file,
        name: file?.name,
        type: file?.type || "(empty/unknown)",
        size: file?.size,
        lastModified: file?.lastModified
      }, null, 2));
    });

    document.getElementById("btnTest1").addEventListener("click", () => {
      const file = fileInput.files?.[0];
      log("=== TEST 1: FILE SELECTION ===\n" + JSON.stringify({
        selected: !!file,
        name: file?.name,
        type: file?.type || "(empty/unknown)",
        size: file?.size,
        lastModified: file?.lastModified
      }, null, 2));
    });

    // TEST 2 — DIRECT BASE64 UPLOAD
    document.getElementById("btnTest2").addEventListener("click", () => {
      const file = fileInput.files?.[0];
      if (!file) {
        log("ERROR: Please select a photo first.");
        return;
      }

      log("Running Test 2: FileReader + Base64 JSON Upload...");
      const reader = new FileReader();

      reader.onload = async () => {
        const base64 = reader.result;
        log("FileReader success. Base64 Length: " + base64?.length + "\nPrefix: " + base64?.substring(0, 40));

        try {
          const response = await fetch("/api/upload", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              image: base64
            })
          });

          const text = await response.text();
          appendLog("HTTP STATUS: " + response.status + "\n\nRESPONSE:\n" + text);
        } catch (error) {
          appendLog("FETCH ERROR:\n" + error);
        }
      };

      reader.onerror = (error) => {
        log("FILEREADER ERROR:\n" + error);
      };

      reader.readAsDataURL(file);
    });

    // TEST 3 — DIRECT MULTIPART UPLOAD
    document.getElementById("btnTest3").addEventListener("click", async () => {
      const file = fileInput.files?.[0];
      if (!file) {
        log("ERROR: Please select a photo first.");
        return;
      }

      log("Running Test 3: Native FormData Upload...");
      const formData = new FormData();
      formData.append("image", file, file.name);

      try {
        const response = await fetch("/api/upload", {
          method: "POST",
          body: formData
        });

        const text = await response.text();
        log("FORMDATA STATUS: " + response.status + "\n\nRESPONSE:\n" + text);
      } catch (error) {
        log("FORMDATA ERROR:\n" + error);
      }
    });

    // TEST 4 — TEST IMAGE PROCESSING SEPARATELY
    document.getElementById("btnTest4").addEventListener("click", () => {
      const file = fileInput.files?.[0];
      if (!file) {
        log("ERROR: Please select a photo first.");
        return;
      }

      log("Running Test 4: Canvas Image Decoding & Downscaling...");
      const img = new Image();

      img.onload = () => {
        const canvas = document.createElement("canvas");
        const max = 1600;
        const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));

        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        try {
          const output = canvas.toDataURL("image/jpeg", 0.82);
          log(
            "CANVAS SUCCESS\n" +
            "Original Dimensions: " + img.naturalWidth + "x" + img.naturalHeight + "\n" +
            "Processed Dimensions: " + canvas.width + "x" + canvas.height + "\n" +
            "Output DataURL Length: " + output.length + "\n" +
            "DataURL Prefix: " + output.substring(0, 40)
          );
        } catch (error) {
          log("CANVAS ERROR:\n" + error);
        }
      };

      img.onerror = (error) => {
        log("IMAGE DECODE ERROR:\n" + error);
      };

      try {
        img.src = URL.createObjectURL(file);
      } catch (err) {
        log("URL.createObjectURL ERROR:\n" + err);
      }
    });
  </script>

</body>
</html>
